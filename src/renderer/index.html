<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' tbimg: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>TraceBit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#view">跳到主要内容</a>
  <div id="app">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 36 36" width="34" height="34" aria-hidden="true">
          <rect x="1" y="1" width="34" height="34" rx="9" fill="#24231f"/>
          <polyline points="7,20 12,20 15,10 20,26 24,16 29,16" fill="none" stroke="#e2aa3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
          <div class="brand-name">TraceBit</div>
          <div class="brand-tagline">看见时间，少费点力</div>
        </div>
      </div>

      <nav id="nav" class="nav-list">
        <button class="nav-item active" data-view="today">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 3v4M17 3v4M3.5 10h17M8 14h3M8 17h7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>今日活动</span>
        </button>
        <button class="nav-item" data-view="report">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>AI 日报</span>
        </button>
        <button class="nav-item" data-view="settings">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h3M11 17h9M14 4v6M7 14v6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="14" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="7" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>设置</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <section class="record-panel" aria-label="记录控制">
          <div class="record-state-line">
            <span id="rec-dot" class="status-dot is-paused"></span>
            <strong id="rec-status-title">正在检查</strong>
          </div>
          <p id="rec-status-detail" class="record-detail">正在读取记录状态</p>
          <button id="rec-toggle" class="button primary record-button" data-action="toggle-recording">开始记录</button>
          <p id="rec-error" class="record-error" hidden></p>
        </section>
        <div class="local-note">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
          数据只保存到这台电脑
        </div>
      </div>
    </aside>

    <main id="view" class="view" tabindex="-1"><!-- rendered by app.js --></main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="屏幕快照预览">
    <button class="lightbox-close icon-button" data-lightbox="close" aria-label="关闭预览">×</button>
    <button class="lightbox-prev icon-button" data-lightbox="prev" aria-label="上一张">‹</button>
    <img id="lightbox-img" src="" alt="屏幕快照大图">
    <button class="lightbox-next icon-button" data-lightbox="next" aria-label="下一张">›</button>
    <div class="lightbox-footer">
      <span id="lightbox-cap"></span>
      <button class="button secondary small" id="lightbox-open">用系统看图打开</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
